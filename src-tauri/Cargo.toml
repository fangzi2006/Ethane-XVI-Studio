[package]
name = "ethane-xvi-studio"
version = "3.0.0"
description = "Ethane-XVI 机械小键盘可视化桌面配置工具"
authors = ["Ethane-XVI"]
edition = "2021"

[lib]
name = "ethane_xvi_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
