name: CI Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. 测试任务（与构建并行执行；失败时立刻取消整个工作流以中止并行构建）
  test:
    name: Test & Typecheck
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test

      - name: TypeScript typecheck
        run: npx tsc -b

      - name: Cancel running build on test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }}

  # 2. 构建任务（与测试并行，每次提交/PR/Tag均执行，产出安装版 + 免安装绿色版）
  build:
    name: Build Windows (Installer & Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (exe + NSIS installer)
        run: npm run tauri build

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $ver = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "${{ github.sha }}".Substring(0, 7) }
          Copy-Item "src-tauri/target/release/ethane-xvi-studio.exe" "release-assets/Ethane-XVI-Studio-$ver-x64-portable.exe"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName "release-assets/Ethane-XVI-Studio-$ver-x64-setup.exe"
          Get-ChildItem release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: release-assets/*
          if-no-files-found: error

  # 3. 发布任务（仅在 v* Tag 触发且测试与构建全部通过后执行，自动发布安装版 + 免安装版）
  release:
    name: Publish GitHub Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets

      - name: Publish Release (Installer & Portable)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          ## Ethane-XVI Studio $tag

          - **安装版**：`Ethane-XVI-Studio-$tag-x64-setup.exe`（Windows 安装向导，支持开始菜单与卸载）
          - **免安装绿色版**：`Ethane-XVI-Studio-$tag-x64-portable.exe`（单文件，双击直接运行）
          "@
          $exists = $false
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { $exists = $true }

          if ($exists) {
            gh release upload $tag release-assets/* --clobber
            gh release edit $tag --draft=false --title "Ethane-XVI Studio $tag" --notes $notes
          } else {
            gh release create $tag release-assets/* --title "Ethane-XVI Studio $tag" --notes $notes
          }
